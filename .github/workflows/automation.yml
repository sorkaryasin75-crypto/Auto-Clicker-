name: Automated Web Clicker Bot

on:
  # ম্যানুয়ালি চালানের জন্য (GitHub-এর Actions ট্যাব থেকে)
  workflow_dispatch:
  
  # নির্দিষ্ট সময় পর পর অটোমেটিক চালানের জন্য (Cron Job)
  # নিচের টাইম সেট করা আছে প্রতি ৩ ঘণ্টা পর পর রান হওয়ার জন্য
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # ১. কোড চেকআউট করা
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ২. Node.js সেটআপ করা
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ৩. ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install Dependencies
        run: npm install

      # ৪. Playwright ব্রাউজার ইনস্টল করা
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ৫. অটোমেশন স্ক্রিপ্ট রান করা
      - name: Run Automation Script
        run: node script.js
