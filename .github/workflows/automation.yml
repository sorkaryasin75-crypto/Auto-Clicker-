name: Automated Web Clicker Bot

on:
  # ১. GitHub Actions UI থেকে ম্যানুয়ালি চালানের অপশন
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Website Link'
        required: true
        default: 'https://educationpointbd24.blogspot.com/?m=1'
      repeat_count:
        description: 'Total Visit Count (Repeat)'
        required: true
        default: '500'

  # ২. অটোমেটিক প্রতি ৩ ঘণ্টা পর পর চালানের জন্য (Cron Job)
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      # ১. রিপোজিটরি কোড ডাউনলোড
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ২. Node.js ইনস্টলেশন
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ৩. প্রজেক্টের প্যাকেজসমূহ ইনস্টল
      - name: Install Dependencies
        run: npm install

      # ৪. Playwright ব্রাউজার এবং সিস্টেম ডিপেন্ডেন্সি ইনস্টল
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ৫. আপডেট করা অটোমেশন স্ক্রিপ্ট কাস্টম ভেরিয়েবল সহ রান করা
      - name: Run Automation Script
        env:
          # ম্যানুয়ালি ইনপুট দিলে সেটি নিবে, নতুবা ডিফল্ট লিংক ও কাউন্ট নিবে
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://example.com' }}
          REPEAT_COUNT: ${{ github.event.inputs.repeat_count || '5' }}
        run: node script.js
